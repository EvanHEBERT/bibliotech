<style>
body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #f8fafc;
    color: #0f172a;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}     

/* Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px; 
    padding-bottom: 20px;
    border-bottom: 1px solid #e2e8f0;
}

.logo-container {
    display: flex; 
    align-items: center; 
    gap: 12px; 
    cursor: pointer;
}

.logo-img {
    height: 50px;
    width: auto;
    object-fit: contain;
}

/* Cartes */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
    min-height: 120px;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    border-color: #bae6fd;
}

.card img {
    max-height: 50px;
    max-width: 80%;
    margin-bottom: 16px;
    object-fit: contain;
}

/* Breadcrumb */
.breadcrumb {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 30px;
    font-weight: 500;
}

.breadcrumb-item {
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
}

.breadcrumb-item:hover { background-color: #e2e8f0; }
.breadcrumb-active { color: #0284c7; }

/* Pannes */
.failure-card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    border: 1px solid #e2e8f0;
    margin-bottom: 20px;
}

.failure-title {
    margin-top: 0;
    color: #ef4444;
    display: flex;
    align-items: center;
    gap: 10px;
}

.solution-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 16px;
}

.box-cause { background: #fef2f2; padding: 16px; border-radius: 8px; }
.box-solution { background: #f0fdf4; padding: 16px; border-radius: 8px; }

.questions-box {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed #cbd5e1;
}

.solution-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}
.solution-item input[type="checkbox"] {
    width: 1.15em;
    height: 1.15em;
    cursor: pointer;
}
.solution-item label {
    cursor: pointer;
}

.step-card {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    background: #f8fafc;
}
.step-number {
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
}
.step-instruction {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 24px;
    color: #1e293b;
    line-height: 1.5;
}
.step-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
}
.btn-action {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.2s;
}
.btn-yes { background: #22c55e; color: white; }
.btn-no { background: #f1f5f9; color: #334155; }
.btn-tech { background: #f59e0b; color: white; }
.btn-restart { background: #64748b; color: white; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

    // --- ÉTAT (State) ---
    let state = { type: null, subType: null, subSubType: null, brand: null, model: null, failure: null, showTech: false, stepIndex: 0, searchQuery: '', searchResults: [] };

    // --- FONCTIONS DE NAVIGATION ---
    function performSearch(query) {
        if (!query || query.length < 2) {
            state.searchResults = [];
            return;
        }
        const lowerQuery = query.toLowerCase();
        const results = [];

        LIBRARY_DATA.forEach(type => {
            const processBrands = (brands, currentType, subType = null, subSubType = null) => {
                if (!brands) return;
                brands.forEach(brand => {
                    if (brand.models) {
                        brand.models.forEach(model => {
                            if (model.name.toLowerCase().includes(lowerQuery) || brand.name.toLowerCase().includes(lowerQuery)) {
                                let path = `${currentType.name}`;
                                if (subType) path += ` > ${subType.name}`;
                                if (subSubType) path += ` > ${subSubType.name}`;
                                if (brand.name) path += ` > ${brand.name}`;
                                path += ` > ${model.name}`;
                                results.push({ type, subType, subSubType, brand, model, path });
                            }
                        });
                    }
                });
            };

            const processSubTypes = (subTypes, currentType) => {
                if (!subTypes) return;
                subTypes.forEach(subType => {
                    if (subType.brands) processBrands(subType.brands, currentType, subType);
                    if (subType.subTypes) subType.subTypes.forEach(subSubType => { if (subSubType.brands) processBrands(subSubType.brands, currentType, subType, subSubType); });
                });
            };

            if (type.models) type.models.forEach(model => { if (model.name.toLowerCase().includes(lowerQuery) || type.name.toLowerCase().includes(lowerQuery)) results.push({ type: type, subType: null, subSubType: null, brand: null, model: model, path: `${type.name} > ${model.name}` }); });
            else if (type.brands) processBrands(type.brands, type);
            else if (type.subTypes) processSubTypes(type.subTypes, type);
        });
        state.searchResults = results;
    }

    function selectType(typeId) {
        state.type = LIBRARY_DATA.find(t => t.id === typeId);
        state.subType = null; state.subSubType = null; state.brand = null; state.model = null; state.failure = null;
        render();
    }
    function selectSubType(subTypeId) {
        state.subType = state.type.subTypes.find(s => s.id === subTypeId);
        state.subSubType = null; state.brand = null; state.model = null; state.failure = null;
        render();
    }
    function selectSubSubType(subSubTypeId) {
        state.subSubType = state.subType.subTypes.find(s => s.id === subSubTypeId);
        state.brand = null; state.model = null; state.failure = null;
        render();
    }
    function selectBrand(brandId) {
        const source = state.subSubType || state.subType || state.type;
        state.brand = source.brands.find(b => b.id === brandId);
        state.model = null; state.failure = null;
        render();
    }
    function selectModel(modelId) {
        const source = state.brand || state.subSubType || state.subType || state.type;
        state.model = source.models.find(m => m.id === modelId);
        state.failure = null;
        render();
    }
    function selectFailure(failureIndex) {
        state.failure = state.model.failures[failureIndex];
        state.showTech = false;
        state.stepIndex = 0;
        render();
    }
    function nextStep() {
        state.stepIndex++;
        render();
    }
    
    function previousStep() {
        // Si on est sur la checklist technicien, on cache juste la checklist pour revenir à l'écran de transition.
        if (state.showTech) {
            state.showTech = false;
            render();
            return;
        }
        if (state.stepIndex > 0) {
            state.stepIndex--;
            render();
        }
    }
    
    function resetAll() { 
        state = { type: null, subType: null, subSubType: null, brand: null, model: null, failure: null, showTech: false, stepIndex: 0, searchQuery: '', searchResults: [] }; 
        const searchInput = document.getElementById('global-search');
        if (searchInput) searchInput.value = '';
        render(); 
    }
    function resetToType() { state.subType = null; state.subSubType = null; state.brand = null; state.model = null; state.failure = null; state.showTech = false; state.stepIndex = 0; render(); }
    function resetToSubType() { state.subSubType = null; state.brand = null; state.model = null; state.failure = null; state.showTech = false; state.stepIndex = 0; render(); }
    function resetToSubSubType() { state.brand = null; state.model = null; state.failure = null; state.showTech = false; state.stepIndex = 0; render(); }
    function resetToBrand() { state.model = null; state.failure = null; state.showTech = false; state.stepIndex = 0; render(); }
    function resetToModel() { state.failure = null; state.showTech = false; state.stepIndex = 0; render(); }

    function goBack() {
        if (state.failure) state.failure = null;
        else if (state.model) state.model = null;
        else if (state.brand) state.brand = null;
        else if (state.subSubType) state.subSubType = null;
        else if (state.subType) state.subType = null;
        else if (state.type) state.type = null;
        render();
    }

            if (state.type) {
                html += `<span>/</span><span class="breadcrumb-item ${state.subType || state.brand ? 'breadcrumb-active' : ''}" data-action="reset-to-type">${state.type.name}</span>`;
            }
            if (state.subType) {
                html += `<span>/</span><span class="breadcrumb-item ${state.subSubType || state.brand ? 'breadcrumb-active' : ''}" data-action="reset-to-sub-type">${state.subType.name}</span>`;
            }
            if (state.subSubType) {

            if (state.brand) {
                html += `<span>/</span><span class="breadcrumb-item ${state.model ? 'breadcrumb-active' : ''}" data-action="reset-to-brand">${state.brand.name}</span>`;
            }
            if (state.model) {
                html += `<span>/</span><span class="breadcrumb-item ${state.failure ? 'breadcrumb-active' : ''}" data-action="reset-to-model">${state.model.name}</span>`;
            }
            if (state.failure) {
                html += `<span>/</span><span class="breadcrumb-item">${state.failure.title}</span>`;

        html += `</div>`;

        html += `<div style="display: flex; gap: 10px;">`;

             html += `<button data-action="go-back" style="padding: 8px 16px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: 600;">Retour</button>`;
        }
        html += `<button data-action="reset-all" style="padding: 8px 16px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: 600;">Accueil</button>`;
        html += `</div>`;

        html += `</div>`; // End of top bar

        // 2. Contenu
        if (state.searchQuery.length > 1) {
            html += `<h2 style="margin-bottom: 20px;">Résultats de recherche pour "${state.searchQuery}"</h2>`;
            if (state.searchResults.length > 0) {
                html += `<div class="card-grid">`;

                        <div class="card" data-action="select-search-result" data-index="${index}">

        else if (!state.type) {

            html += `</div>`;
        } else if (state.type.subTypes && !state.subType) {

            state.type.subTypes.forEach(subType => {
                html += `<div class="card" data-action="select-sub-type" data-id="${subType.id}"><div style="font-size: 18px; font-weight: bold;">${subType.name}</div></div>`;
            });
            html += `</div>`;
        } else if (state.subType && state.subType.subTypes && !state.subSubType) {
            // Niveau supplémentaire (ex: Concentrateur -> Fixe/Portable)
            html += `<h2>Type (${state.subType.name})</h2><div class="card-grid">`;
            state.subType.subTypes.forEach(sub => {
                html += `<div class="card" data-action="select-sub-sub-type" data-id="${sub.id}"><div style="font-size: 18px; font-weight: bold;">${sub.name}</div></div>`;
            });
            html += `</div>`;
        } else if (!state.brand && ( (state.type && state.type.brands) || (state.subType && state.subType.brands) || (state.subSubType && state.subSubType.brands) ) ) {
            // Étape de sélection de la marque (pour VNI, VAA, PPC)
            const source = state.subSubType || state.subType || state.type;

            html += `</div>`;
        } else if (!state.failure) {
            // Vue : Choix du problème
            html += `<h2>Problèmes connus pour : ${state.model.name}</h2>`;
            if (state.model.failures.length === 0) {
                html += `<p style="color: #64748b; font-style: italic;">Aucune panne connue enregistrée.</p>`;
            } else {
                html += `<div class="card-grid">`;
                state.model.failures.forEach((failure, index) => {
                    html += `<div class="card" data-action="select-failure" data-index="${index}"><div style="font-size: 18px; font-weight: bold;">${failure.title}</div></div>`;
                });
                html += `</div>`;
            }
        } else {
            // Vue : Détail du problème (causes et solutions)
            const failure = state.failure;
            // Gestion de la compatibilité entre 'causes' (tableau) et 'cause' (chaîne unique)
            const causesList = Array.isArray(failure.causes) ? failure.causes : (failure.cause ? [failure.cause] : []);
            const causesHtml = causesList.map((cause, idx) => `
                <div class="solution-item">
                    <input type="checkbox" id="cause-${idx}">
                    <label for="cause-${idx}">${cause}</label>
                </div>
            `).join('');

            // Logique du guide étape par étape
            const patientSteps = failure.solutionsPatient || [];
            const techSteps = failure.solutionsTech || [];
            const totalPatientSteps = patientSteps.length;
            
            let guideContent = '';
            
            // Cas 1 : On est dans les étapes Patient
            if (state.stepIndex < totalPatientSteps) {
                guideContent = `
                    <div class="step-card">
                        <div class="step-number">Étape Patient ${state.stepIndex + 1} / ${totalPatientSteps}</div>
                        <div class="step-instruction">${patientSteps[state.stepIndex]}</div>
                        <div class="step-actions">
                            ${state.stepIndex > 0 ? `<button class="btn-action btn-no" data-action="previous-step">⬅️ Précédent</button>` : ''}
                            <button class="btn-action btn-yes" data-action="reset-to-model">✅ Résolu</button>
                            <button class="btn-action btn-no" data-action="next-step">❌ Non résolu, étape suivante</button>
                        </div>
                    </div>
                `;
            } 
            // Cas 2 : Transition vers Technicien (si non autorisé encore)
            else if (state.stepIndex === totalPatientSteps && !state.showTech && techSteps.length > 0) {
                guideContent = `
                    <div class="step-card" style="border-color: #f59e0b; background: #fffbeb;">
                        <div class="step-instruction" style="color: #b45309;">⚠️ Les solutions patient n'ont pas fonctionné.<br>Voulez-vous passer aux étapes technicien ?</div>
                        <div class="step-actions">
                            <button class="btn-action btn-no" data-action="previous-step">⬅️ Précédent</button>
                            <button class="btn-action btn-tech" data-action="show-tech">🛠️ Oui, je suis technicien</button>
                            <button class="btn-action btn-restart" data-action="reset-to-model">Retour au modèle</button>
                        </div>
                    </div>
                `;
            }
            // Cas 3 : Checklist Technicien
            else if (state.showTech && techSteps.length > 0) {
                const techChecklistHtml = techSteps.map((step, idx) => `
                    <div class="solution-item" style="margin-bottom: 12px; align-items: flex-start; text-align: left;">
                        <input type="checkbox" id="tech-step-${idx}" style="margin-top: 5px; flex-shrink: 0;">
                        <label for="tech-step-${idx}">${step}</label>
                    </div>
                `).join('');

                guideContent = `
                    <div class="step-card" style="border-color: #f59e0b;">
                        <h4 style="color: #d97706; margin-top: 0; margin-bottom: 15px; font-size: 16px; text-align: left;">Checklist Technicien</h4>
                        ${techChecklistHtml}
                        <div class="step-actions" style="margin-top: 24px;">
                            <button class="btn-action btn-no" data-action="previous-step">⬅️ Précédent</button>
                            <button class="btn-action btn-yes" data-action="reset-to-model">✅ Intervention terminée</button>
                        </div>
                    </div>
                `;
            }
            // Cas 4 : Échec total
            else {
                guideContent = `
                    <div class="step-card" style="border-color: #ef4444; background: #fef2f2;">
                        <div class="step-instruction" style="color: #991b1b;">❌ Toutes les solutions ont été tentées.<br>Le problème persiste.</div>
                        <div style="margin-bottom: 20px; color: #7f1d1d;">Veuillez contacter le support niveau 2 ou procéder au remplacement de l'appareil.</div>
                        <div class="step-actions">
                            <button class="btn-action btn-restart" data-action="reset-to-model">Terminer l'intervention</button>
                        </div>
                    </div>
                `;
            }

            html += `<h2 style="border-bottom: 2px solid #0284c7; display: inline-block; padding-bottom: 4px;">Guide de dépannage : ${state.model.name}</h2>`;
            html += `
                <div class="failure-card">
                    <h3 class="failure-title">⚠️ ${failure.title}</h3>
                    <div class="solution-grid">
                        <div class="box-cause">
                            <strong style="color: #991b1b; display: block; margin-bottom: 8px;">Causes probables</strong><div style="color: #7f1d1d;">${causesHtml}</div>
                        </div>
                        <div class="box-solution" style="display: flex; flex-direction: column; justify-content: center;">
                            ${guideContent}
                        </div>
                    </div>
                </div>`;
        }
        app.innerHTML = html;
    }
    render();

    // --- GESTION DES INTERACTIONS ---
    function handleInteraction(event) {
        const target = event.target;
        const actionTarget = target.closest('[data-action]');

        if (!actionTarget) return;

        const { action, id, index } = actionTarget.dataset;

        switch (action) {
            // Navigation
            case 'select-type': selectType(id); break;
            case 'select-sub-type': selectSubType(id); break;
            case 'select-sub-sub-type': selectSubSubType(id); break;
            case 'select-brand': selectBrand(id); break;
            case 'select-model': selectModel(id); break;
            case 'select-failure': selectFailure(parseInt(index, 10)); break;
            case 'select-search-result':
                const result = state.searchResults[parseInt(index, 10)];
                state.type = result.type;
                state.subType = result.subType;
                state.subSubType = result.subSubType;
                state.brand = result.brand;
                state.model = result.model;
                resetAll(); // Reset everything including search state and input
                render();
                break;

            // Breadcrumb / Header
            case 'reset-all': resetAll(); break;
            case 'go-back': goBack(); break;
            case 'reset-to-type': resetToType(); break;
            case 'reset-to-sub-type': resetToSubType(); break;
            case 'reset-to-sub-sub-type': resetToSubSubType(); break;
            case 'reset-to-brand': resetToBrand(); break;
            case 'reset-to-model': resetToModel(); break;

            // Guide
            case 'previous-step': previousStep(); break;
            case 'next-step': nextStep(); break;
            case 'show-tech': 
                state.showTech = true;
                render();
                break;
        }
    }
    document.addEventListener('click', handleInteraction);

    document.addEventListener('input', (event) => {
        if (event.target.id === 'global-search') {
            state.searchQuery = event.target.value;
            performSearch(state.searchQuery);
            render();
        }
    });
</script>
</body>
</html>
